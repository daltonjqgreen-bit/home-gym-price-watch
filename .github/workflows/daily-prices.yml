name: Daily price check & deploy

on:
  schedule:
    - cron: "0 16 * * *"   # every day 16:00 UTC = 6:00 AM Hawaii time (HST, no DST)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch today's prices (scheduled/manual runs only)
        if: github.event_name != 'push'
        run: python fetch.py
      - name: Build site
        run: python build_site.py
      - name: Commit new snapshot
        if: github.event_name != 'push'
        run: |
          git config user.name "price-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/snapshots data/history.json data/product_history.json
          git diff --cached --quiet || (git commit -m "Daily price snapshot $(TZ=Pacific/Honolulu date +%F)" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
